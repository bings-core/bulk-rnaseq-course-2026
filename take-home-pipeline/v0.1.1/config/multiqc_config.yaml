report_comment: >
    This report has been generated by the <a href="https://bings.mssm.edu" target="_blank">BiNGS Core</a> RNA-Seq
    analysis pipeline. 

# Run only these modules
run_modules:
    - custom_content
    - fastqc
    - cutadapt
    - star
    - salmon
    - samtools
    - qualimap
    - preseq
    - featurecounts

module_order:
    - fastqc:
        name: 'FastQC (raw)'
        anchor: 'fastqc_raw'
        info: 'This section of the report shows FastQC results before adapter trimming.'
        path_filters:
            - '*/fastqc_*/*.zip'
    - cutadapt
    - fastqc:
        name: 'FastQC (trimmed)'
        anchor: 'fastqc_trimmed'
        info: 'This section of the report shows FastQC results after adapter trimming.'
        path_filters:
            - '*/trim_galore_*/*.zip'
    - star
    - samtools
    - preseq
    - qualimap
    - salmon
    - biotype_counts
    - deseq2_clustering
    - deseq2_pca_condition
    - deseq2_pca_sequencing_batch
    - sample_metadata_table

# Move custom-content sections to the bottom of the report
report_section_order:
    sample_metadata_table:
        order: 100
    general_stats:
        order: -1100
    fastqc_raw:
        order: -1200
    cutadapt:
        order: -1300
    fastqc_trimmed:
        order: -1400
    star:
        order: -1500
    # --- CHANGE (Claude/DD, 2026-09-21): anchor renamed upstream, Samtools -> samtools ---
    # In 1.10.1 the rendered anchor was literally "Samtools"; 1.35 emits "samtools", so this
    # ordering directive silently stopped matching and samtools jumped from position 6 to 2.
    samtools:
        order: -1600
    # --- CHANGE (Claude/DD, 2026-09-21): order MultiQC 1.35's new auto software-versions section ---
    # 1.35 auto-generates a "Software Versions" section (anchor multiqc_software_versions) that
    # did not exist in 1.10.1. Unordered, it landed at position 3. BiNGS already emits its own
    # software_versions custom-content section, so this one is pinned next to it at the end rather
    # than interleaved with the QC modules. Suppressing it entirely is the alternative -- kept,
    # because it reports the versions MultiQC actually parsed, which the custom section does not.
    multiqc_software_versions:
        order: -2450
    preseq:
        order: -1650 
    biotype_counts:
        order: -1700
    featurecounts:
        order: -1800
    qualimap:
        order: -1900
    deseq2_pca_sequencing_batch:
        order: -2000
    deseq2_pca_condition:
        order: -2100
    deseq2_clustering:
        order: -2200
    salmon:
        order: -2300
    annotation_information:
        order: -2400
    software_versions:
        order: -2500

extra_fn_clean_exts:
    - '_val_1'
    - '_val_2'
    - '.biotype'

# Customise the module search patterns to speed up execution time
#  - Skip module sub-tools that we are not interested in
#  - Replace file-content searching with filename pattern searching
#  - Don't add anything that is the same as the MultiQC default
# See https://multiqc.info/docs/#optimise-file-search-patterns for details
sp:
    cutadapt:
        fn: '*trimming_report.txt'
    
    salmon/meta:
        fn: 'meta_info.json'
    star:
        fn: '*_Log.final.out'
        ignore:
            - '*/align_1st_pass/*'
            - '*/align_multi/*'
    samtools/stats:
        fn: '*.stats'
    samtools/flagstat:
        fn: '*.flagstat'
    samtools/idxstats:
        fn: '*.idxstats*'
    preseq:
        fn: '*.ccurve.txt'
# --- CHANGE (Claude/DD, 2026-09-21): disable the MultiQC 1.35 AI toolbox ---
# 1.35's default template embeds client-side code that POSTs report content to
# https://api.anthropic.com/v1/messages, https://api.openai.com/v1/chat/completions and
# Seqera's internal-ai endpoint. No API key is embedded, so it is inert until a viewer supplies
# one -- but these reports are published to a PUBLIC DMZ host, and embedded third-party LLM
# endpoints in a published page are a security-review finding regardless of whether they fire.
# Set in the CONFIG rather than only as a CLI flag, so the setting travels with the pipeline.
no_ai: true
ai_summary: false
ai_summary_full: false

# --- CHANGE (Claude/DD, 2026-09-23): never let MultiQC search its own output tree ---
# MultiQC 1.35 writes multiqc.parquet into its <report>_data/ dir and a LATER run DISCOVERS and
# MERGES it (search key 'multiqc_data'). A3 runs multiqc twice into ONE --outdir (multiqc_1.35/)
# and that outdir sits INSIDE the search root, so the 2nd (client) run loaded the 1st (bings)
# run's parquet and rendered "DESeq2 PCA plot - Condition" and "BiNGS ... Software Versions"
# TWICE. Measured: client had 1 parquet load + 36 merge_with_previous; bings had 0 (empty outdir).
# 1.10.1 has no parquet feature, so the baseline reports do not duplicate -- this is a 1.35 regression.
# Exclusions were NOT defeated (featurecounts_biotype/star_geneCounts/fastqc/cutadapt/samtools/
# salmon all 0 in the client report), so no client leak -- the damage was duplicate sections only.
# Also fixes non-idempotency: re-running into a non-empty outdir produced
# "load_multiqc_data ... failed to vstack column 'series'" errors from the same feature.
fn_ignore_dirs:
    - "multiqc_*"
# --- END CHANGE ---
